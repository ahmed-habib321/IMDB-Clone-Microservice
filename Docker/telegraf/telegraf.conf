# --- Elasticsearch ---
[[inputs.elasticsearch]]
  servers = ["http://elasticsearch:9200"]
  local = true
  cluster_health = true
  cluster_stats = true
  indices_include = ["*"]

# --- MinIO (native Prometheus endpoint) ---
[[inputs.prometheus]]
  urls = ["http://minio:9000/minio/v2/metrics/cluster"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
