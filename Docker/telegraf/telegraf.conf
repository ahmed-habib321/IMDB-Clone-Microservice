[agent]
  interval = "15s"
  flush_interval = "15s"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

[[inputs.redis]]
  servers = ["tcp://redis:6379"]

# --- PostgreSQL: one extensible block per service DB host ---
[[inputs.postgresql_extensible]]
  address = "host=user-db port=5432 user=admin password=admin sslmode=disable dbname=user_db"
  databases = ["user_db"]
  [[inputs.postgresql_extensible.query]]
    sqlquery = "SELECT datname, numbackends, xact_commit, xact_rollback, blks_read, blks_hit, tup_returned, tup_fetched, tup_inserted, tup_updated, tup_deleted, deadlocks, temp_files, temp_bytes FROM pg_stat_database WHERE datname NOT IN ('template0','template1')"
    measurement = "postgresql"

