spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  cloud:
    config:
      enabled: false
  config:
    import:

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-must-be-at-least-32-bytes-long!!
  access-token-expiry-ms: 300000
  refresh-token-expiry-ms: 900000
  email-token-expiry-ms: 86400000
  password-reset-expiry-ms: 900000
  issuer: test-issuer

app:
  base-url: http://localhost:8080
  oauth2:
    redirect-uri: http://localhost:3000/auth/callback

spring.mail.host: localhost
spring.mail.port: 25