spring:

  datasource:
    url: jdbc:postgresql://${database.host}:${database.port}/${database.name}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: auth_service

  # Email
  mail:
    host: ${mail.host}
    port: ${mail.port}
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAuth2.Google.Client-id}
            client-secret: ${OAuth2.Google.Client-Secret}
            scope: email, profile

  data:
    redis:
      host: ${Redis.host}
      port: ${Redis.port}


rate-limit:
  paths:
    - /api/v1/auth/**
  capacity: 20
  refill: 20
  refill-period: 1m
  allowed-origins:
    - http://localhost:4200
    - http://localhost:3000


