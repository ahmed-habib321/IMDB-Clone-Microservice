spring:

  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1500
        max-attempts: 6
        max-interval: 2000
    loadbalancer:
      cache:
        ttl: 5s

  datasource:
    url: jdbc:postgresql://${database.host}:${database.port}/${database.name}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Kafka defaults (services override only what differs) ──────────
  kafka:
    bootstrap-servers: ${Kafka.server}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  loki:
    url: http://${Loki.Host}:${Loki.Port}/loki/api/v1/push
  level:
    io.micrometer.tracing: DEBUG
    org.springframework.boot.opentelemetry: DEBUG

management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      enabled: true
      sampling:
        probability: 1.0
      export:
        otlp:
          endpoint: http://${Tempo.host}:${Tempo.otlp_port}/v1/traces

  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

    observations:
      key-values:
        application: ${spring.application.name}

EurekaLink : ${EurekaOrigin}/eureka/

eureka:
  client:
    service-url:
      defaultZone: ${EurekaLink}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
