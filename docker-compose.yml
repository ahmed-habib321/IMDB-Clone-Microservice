services:

  user-db:
    image: postgres
    container_name: user-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  title-db:
    image: postgres
    container_name: title-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: title_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_title_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  people-db:
    image: postgres
    container_name: people-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: people_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_people_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  ratings-reviews-db:
    image: postgres
    container_name: ratings-reviews-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ratings_reviews_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_ratings_reviews_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  lists-db:
    image: postgres
    container_name: lists-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: lists_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_lists_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  media-db:
    image: postgres
    container_name: media-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: media_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_media_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  news-db:
    image: postgres
    container_name: news-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: news_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_news_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  awards-db:
    image: postgres
    container_name: awards-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: awards_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_awards_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - IMDB-Clone-Microservice

  contribution-db:
    image: postgres
    container_name: contribution-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: contribution_db
    ports:
      - "5441:5432"
    volumes:
      - postgres_contribution_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  auth-db:
    image: postgres
    container_name: auth-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    ports:
      - "5443:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  notification-db:
    image: postgres
    container_name: notification-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notification_db
    ports:
      - "5444:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql
    networks:
      - IMDB-Clone-Microservice

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - IMDB-Clone-Microservice

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - IMDB-Clone-Microservice

  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    entrypoint:
      - /bin/sh
    command:
      - /usr/local/bin/replace_env.sh
    environment:
      EUREKA_HOST: ${EUREKA_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.tmpl:ro
      - ./Docker/prometheus/replace_env.sh:/usr/local/bin/replace_env.sh:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - IMDB-Clone-Microservice

  loki:
    image: grafana/loki:3.1.2
    container_name: loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - IMDB-Clone-Microservice

  tempo:
    image: grafana/tempo:2.2.2
    container_name: tempo
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./Docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./data/tempo:/tmp/tempo
    ports:
      - "3200:3200"
      - "9411:9411"   # zipkin listen port
#      - "4317:4317"   # OTLP gRPC
#      - "4318:4318"   # OTLP HTTP — services send directly here
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - IMDB-Clone-Microservice

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_INSTALL_PLUGINS: hamedkarbasi93-kafka-datasource, redis-datasource
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_SECURITY_COOKIE_SAMESITE: none
    volumes:
      - ./Docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./Docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Docker/grafana/plugins:/var/lib/grafana/plugins
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      pyroscope:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - IMDB-Clone-Microservice

  elasticsearch:
    image: elasticsearch:9.2.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - IMDB-Clone-Microservice

  kibana:
    image: kibana:9.2.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy   # ← wait for ES to be actually ready
    networks:
      - IMDB-Clone-Microservice

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - IMDB-Clone-Microservice

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_started
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - IMDB-Clone-Microservice

  redis-exporter:
    build:
      context: .
      dockerfile_inline: |
        FROM oliver006/redis_exporter:v1.88.0
        COPY --from=busybox:1.36-musl /bin/busybox /bin/busybox
    container_name: redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "9121:9121"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - IMDB-Clone-Microservice

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - IMDB-Clone-Microservice

  pyroscope:
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/pyroscope:2.2.1
        COPY --from=busybox:1.36-musl /bin/busybox /bin/busybox
    container_name: pyroscope
    ports:
      - "4040:4040"
    networks:
      - IMDB-Clone-Microservice
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:4040/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - ./Docker/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - IMDB-Clone-Microservice

  telegraf:
    image: telegraf:1.30.3
    container_name: telegraf
    entrypoint:
      - /usr/bin/telegraf
    command:
      - --config
      - /etc/telegraf/telegraf.conf
    volumes:
      - ./Docker/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9273:9273"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9273/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - IMDB-Clone-Microservice

  # ─── Spring Boot Services ──────────────────────────────────────

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: discovery-server/target/*.jar
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=discovery-server -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      SPRING_PROFILES_ACTIVE: Docker
    networks:
      - IMDB-Clone-Microservice
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: config-server/target/*.jar
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=config-server -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761
      SPRING_PROFILES_ACTIVE: native,Docker
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: api-gateway/target/*.jar
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=api-gateway -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761
      SPRING_PROFILES_ACTIVE: Docker
      DATABASE_HOST: auth-db
      DATABASE_NAME: auth_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: your@email.com
      MAIL_PASSWORD: your-password

      GOOGLE_CLIENT_ID: xxxxx
      GOOGLE_CLIENT_SECRET: xxxxx

      JWT_SECRET: changeme-this-must-be-at-least-32-bytes-long-for-sha256

      ACCESS_TOKEN_EXPIRY_MS: 300000
      EMAIL_TOKEN_EXPIRY_MS: 300000
      PASSWORD_RESET_EXPIRY_MS: 300000
      REFRESH_TOKEN_EXPIRY_MS: 604800000
      JWT_ISSUER: imdb-clone

      APP_BASE_URL: http://localhost:8080
      OAUTH2_REDIRECT_URI: http://localhost:3000/auth/callback

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-db:
        condition: service_started
      kafka:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: user-service/target/*.jar
    container_name: user-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=user-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761

      SPRING_PROFILES_ACTIVE: Docker
      DATABASE_HOST: user-db
      DATABASE_NAME: user_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      user-db:
        condition: service_started
      kafka:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: notification-service/target/*.jar
    container_name: notification-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=notification-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761

      SPRING_PROFILES_ACTIVE: Docker
      DATABASE_HOST: notification-db
      DATABASE_NAME: notification_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: your@email.com
      MAIL_PASSWORD: your-password

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      notification-db:
        condition: service_started
      kafka:
        condition: service_started

  people-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: people-service/target/*.jar
    container_name: people-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=people-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761

      SPRING_PROFILES_ACTIVE: Docker
      DATABASE_HOST: people-db
      DATABASE_NAME: people_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092

      # people-service calls title-service through the gateway for filmography
      SERVICE_CLIENT_TITLE_SERVICE_URL: http://api-gateway:8080
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      people-db:
        condition: service_started
      kafka:
        condition: service_started
      api-gateway:
        condition: service_started

  search-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: search-service/target/*.jar
    container_name: search-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=search-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761

      SPRING_PROFILES_ACTIVE: Docker
      ELASTICSEARCH_HOST: elasticsearch

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092

      # search-service calls title-service through the gateway to (re)index titles
      SERVICE_CLIENT_TITLE_SERVICE_URL: http://api-gateway:8080
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
      api-gateway:
        condition: service_started

  awards-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: awards-service/target/*.jar
    container_name: awards-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=awards-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
      EUREKA_ORIGIN: http://discovery-server:8761

      SPRING_PROFILES_ACTIVE: Docker
      DATABASE_HOST: awards-db
      DATABASE_NAME: awards_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin

      LOKI_HOST: loki
      LOKI_PORT: 3100

      KAFKA_SERVER: kafka:9092
    networks:
      - IMDB-Clone-Microservice
    depends_on:
      config-server:
        condition: service_healthy
      awards-db:
        condition: service_started
      kafka:
        condition: service_started

  title-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: title-service/target/*.jar
    container_name: title-service
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/pyroscope.jar -Dpyroscope.application.name=title-service -Dpyroscope.server.address=http://pyroscope:4040 -Dpyroscope.profiler.event=itimer -Dpyroscope.format=jfp"
