<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .header {
            background: #f5c518;
            color: #000;
            text-align: center;
            padding: 24px;
        }

        .content {
            padding: 32px;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Your password has been changed</h2>
    </div>

    <div class="content">

        <p>This email confirms that your <span th:text="${brandName}">IMDb Clone</span> account password was changed successfully.</p>

        <p>If you made this change, no further action is required.</p>

        <p>If you did not change your password, please contact support immediately and secure your account.</p>

    </div>

</div>

</body>
</html>
