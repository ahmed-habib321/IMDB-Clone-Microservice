<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .header {
            background: #f5c518;
            color: #000;
            text-align: center;
            padding: 24px;
        }

        .content {
            padding: 32px;
            color: #333;
            line-height: 1.6;
        }

        .otp-box {
            background: #f8f9fa;
            border: 2px dashed #f5c518;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .otp-box span {
            font-size: 32px;
            font-weight: bold;
            color: #000;
            font-family: 'Courier New', monospace;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h2>Password Reset Request</h2>
    </div>

    <div class="content">

        <p>We received a request to reset your password.</p>

        <p>Please use the 6-digit OTP below to reset your password:</p>

        <div class="otp-box">
            <span th:text="${resetUrl}">OTP</span>
        </div>

        <p>Enter this OTP in the app to reset your password.</p>

        <p>If you didn't request this, you can safely ignore this email.</p>

    </div>

</div>

</body>
</html>
